[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lda-design"
version = "0.9.196"
description = "LDA — Agent-native open-source photon (PDA) + quantum (QEDA) chip design software"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "LDA Open-Source Community" }]
keywords = [
    "photonics",
    "silicon-photonics",
    "quantum",
    "EDA",
    "chip-design",
    "agent-native",
    "fdtd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# 性能升维后端（缺失时自动回退纯 numpy / SKIP）
numba = ["numba>=0.58"]
torch = ["torch>=2.0"]
# 报告与可视化（可选）
viz = ["matplotlib>=3.6", "pandas>=2.0", "networkx>=2.8", "tqdm>=4.60"]
# 多用户数据层（P2.2）：bcrypt 为推荐密码哈希后端；缺省自动回退标准库 pbkdf2
data = ["bcrypt>=4.0"]
# 文档生成辅助（docs/scripts 下的非核心运行时脚本）
docs = ["Pillow>=9.0", "python-docx>=0.8.11", "reportlab>=3.6", "qrcode>=7.0"]
# 开发 / 打包
dev = ["build", "wheel", "pytest", "pyflakes>=3.0"]

[project.urls]
Homepage = "https://github.com/iduyuhe/LDA"
Repository = "https://github.com/iduyuhe/LDA"
Documentation = "https://github.com/iduyuhe/LDA/tree/main/docs"

[project.scripts]
lda = "lda_design.cli:main"

[tool.pytest.ini_options]
# 🔴 T5.1（v0.9.138）· **双入口并存，主入口不变**：
#   · 主入口（权威） = `python run_ci_regression.py --tag core`（见 CONTRIBUTING.md）
#   · 第二入口       = `pytest`（本段配置），**只增不减**，不替换主入口
# 两条入口跑的是**同一份判据**：pytest 的 `smoke` 档直接调用主入口的
# `_run_one`（见 tests/test_smoke_core.py），不复制判据、不另立口径。
#
# testpaths：收集面锁死在 tests/。若在仓库根裸跑 pytest，会走到三方隔离区
# vendor/devsim_mirror 内的 devsim 测试，收集期 `import devsim` 失败 ⇒ pytest
# 整体报 error（2026-09-19 全面审计实测 rc=2 / 244.3s）。norecursedirs 保留为
# 第二道闸：即使有人显式指定路径，也不进隔离区。
testpaths = ["tests"]
norecursedirs = ["vendor", "lda_cuda_venv", "node_modules", ".cache", ".git", "build", "dist", "*.egg"]
# 默认档＝快档：排除 `smoke`（逐条跑 CORE_SMOKES 子进程，全量口径 = CI core），
# 只跑 tests/ 下的静态契约（秒级）。`pytest -m smoke` 跑全量 smoke 档。
# `--strict-markers`：拼错 marker 名直接报错，杜绝「悄悄全跑 / 悄悄全不跑」。
addopts = "-m 'not smoke' --strict-markers"
markers = [
    "smoke: 逐条以子进程跑 CORE_SMOKES（与 `run_ci_regression --tag core` 同口径）；默认不跑，用 `pytest -m smoke` 跑全量",
]

[tool.setuptools]
# 源码树中可导入包位于 lda/ 子目录（扁平 lda_* 命名空间）
package-dir = { "" = "lda" }
packages = [
    "lda_agent",
    "lda_chain",
    "lda_harness",
    "lda_ir",
    "lda_l1",
    "lda_l2",
    "lda_l3",
    "lda_layout",
    "lda_pdk",
    "lda_qeda",
    "lda_solver",
    "lda_design",
    "lda_webui",
    "lda_data",
    "lda_license",
    "ext_oracle",
    "examples",
]

[tool.setuptools.package-data]
lda_webui = ["static/*", "static/**/*", "*.html", "*.js", "*.css"]
examples = ["*.json", "*.py"]
"*" = ["*.json", "*.yaml", "*.yml", "*.csv", "*.txt", "*.md", "*.html", "*.js", "*.css", "*.svg"]
