<text x="34" y="498" font-family="Arial" font-size="9.5" fill="#475569">紧界可达（N=216）：参数界 215 ≤ 紧界 216 = 矩形可达 216 ≤ Reck 最优 429 ⇒ 省 213 层</text>
<text x="34" y="514" font-family="Arial" font-size="9.5" fill="#475569">元件数仍 = N(N−1)/2（Clements 必要性定理）⇒ 收益纯在深度，不增元件；深度仍 Ω(N)</text>
<text x="34" y="536" font-family="Arial" font-size="8.8" fill="#94a3b8">诚实边界：本演示为网格拓扑 + 酉重构的正确性证明（数学 + 构造性数值），非真机实测；未含波导损耗/非理想耦合/串扰</text>
