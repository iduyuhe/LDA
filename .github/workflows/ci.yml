name: LDA Self-Check

# 每次 push / PR 到 main 自动跑：确定性比对裁判 + 实证大数据锚。
# 轻量、纯 numpy、不依赖 torch，验证"LLM 不进判决路径"这条红线持续成立。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deterministic-judge:
    name: Deterministic judge + empirical anchor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps (numpy only)
        run: python -m pip install --upgrade pip numpy

      - name: Run deterministic comparison judge (B1-B11)
        run: |
          cd lda
          python run_harness.py

      - name: Run empirical big-data anchor (mitigates trust-wall risk)
        run: |
          cd lda/lda_harness
          python run_empirical_bank.py
