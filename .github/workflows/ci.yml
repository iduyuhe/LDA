name: LDA Self-Check

# 每次 push / PR 到 main 自动跑：确定性比对裁判 + 实证大数据锚。
# 轻量、纯 numpy、不依赖 torch，验证"LLM 不进判决路径"这条红线持续成立。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deterministic-judge:
    name: Deterministic judge + empirical anchor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps (numpy + scipy)
        run: python -m pip install --upgrade pip numpy scipy

      - name: Run deterministic comparison judge (B1-B11)
        run: |
          cd lda
          python run_harness.py

      - name: Run empirical big-data anchor (mitigates trust-wall risk)
        run: |
          cd lda/lda_harness
          python run_empirical_bank.py

      - name: Agent design loop smoke (bragg mirror, numpy backend)
        # 回归防护：曾因扁平导入(design_loop→l1_protocol)导致 agent 链路整体不可用，
        # CI 此前只跑 harness 未覆盖；现补冒烟，确保闭环入口可持续运行。
        run: |
          cd lda/lda_agent
          python run_demo.py --threshold 0.90 --backend numpy --out /tmp/lda_ci_demo

      - name: WebUI import smoke (webui server + new closed-loop endpoints)
        # 回归防护：D-07 把 D-01 耦合器验收锚 / D-03 多波长闭环 / D-05 L0 IR 接入 webui。
        # 校验服务可导入，且三个新端点返回结构正确；coupler 在 CI(无 GPU) 走 ORACLE
        # 真值演示路径（快速、不挂起），band/ir 为纯 numpy/静态（快速）。
        run: |
          cd lda
          python -c "
          import sys; sys.path.insert(0,'.')
          import lda_webui.app as A
          s = A.system_status()
          assert len(s['layers']) >= 8 and s['pdks_registered'] >= 1
          ir = A.run_ir_demo({})
          assert ir['all_valid'] and len(ir['examples']) == 4, ir
          yb = A.run_coupler_loop({'kind':'ybranch'})
          yb_m = yb if 'metrics' not in yb else yb['metrics']   # live_fdtd 展平 / oracle_only 嵌套
          assert yb['kind'] == 'ybranch' and 'fracA' in yb_m, yb
          dc = A.run_coupler_loop({'kind':'dc','gap':0.3})
          dc_m = dc if 'metrics' not in dc else dc['metrics']
          assert dc['kind'] == 'dc' and 'kappa_oracle' in dc_m, dc
          print('webui D-07 endpoints OK: layers=%d pdks=%d ir=%d yb=%s dc=%s' % (
            len(s['layers']), s['pdks_registered'], len(ir['examples']), yb['mode'], dc['mode']))
          "

      - name: Coupler/beamsplitter module import smoke (D-01, no GPU numerics)
        # 回归防护：D-01 新增 fdtd3d_coupler/oracle_coupler/coupler_loop 三模块，
        # GPU 数值验收在本机跑（CI 无 GPU），此处仅验证模块可导入、无语法/路径回归。
        run: |
          cd lda
          python -c "import sys; sys.path[:0]=['lda_agent','lda_solver','lda_harness']; import fdtd3d_coupler, oracle_coupler, coupler_loop; print('coupler modules import OK')"

      - name: Unified verification contract smoke (D-04, harness + solver_writer)
        # 回归防护：D-04 统一验证契约（VerificationSpec + 四套适配器）。
        # CI 跑不依赖 GPU 的快项（harness B1-B11 + solver_writer 1.4），
        # waveguide/coupler 数值验收在本机跑。
        run: |
          cd lda/lda_harness
          python run_all_specs.py --skip waveguide coupler --json reports/ci_unified_report.json | tail -5

      - name: Multiband design loop smoke (D-03, full-band spectrum acceptance)
        # 回归防护：D-03 把 1.2 单波长验收升级为全波段谱形验收。
        # 验证 band 验收闭环可在 CI(纯 numpy) 跑通且 PASS（阻带全达标 + 全波段 max|ΔR|≤容差）。
        run: |
          cd lda
          python -c "import sys; sys.path.insert(0,'.'); from lda_agent.multiband_loop import main_band; r=main_band(); assert r['accepted'], r['verdict']; print('D-03 multiband PASS, R_min=%.4f, max_abs_err=%.2e'%(r['final_band_min_R_fdtd'], r['final_max_abs_err']))"

      - name: L0 IR v0.2 augmentation smoke (D-05, static field completion)
        # 回归防护：D-05 L0 IR 字段补全（方向耦合器 / 对称 Y 分支 / 微环 Q·κ·FSR /
        # 量子 Transmon.target_f01 骨架）。纯静态（校验 + 序列化 round-trip + DSL +
        # 导出 JSON），不跑 GPU 逆设计；bridge 调用被 try/except 包住（DesignProblem
        # 已从 design_loop 移除，仅 WARN，不影响本 smoke）。
        run: |
          cd lda
          python run_ir_d05_smoke.py

      - name: Empirical corpus incremental import smoke (D-06, csv/json/dedup/trace)
        # 回归防护：D-06 把 seed_empirical.json 升级为可增量语料库。
        # 验证 csv/JSON 批量导入 + 去重冲突 + 逐条溯源 provenance 全绿（纯静态）。
        run: |
          cd lda
          python run_d06_smoke.py

      - name: Empirical submission CLI smoke (D-10, corpus registration tool)
        # 回归防护：D-10 实测语料补登 CLI（与 empirical_measurement.yml 同源）。
        # 验证 issue markdown 生成 + bank 追加去重 + validate 命令（纯静态）。
        run: |
          cd lda
          python run_d10_smoke.py
