# LDA 自托管编排（P2.1）
# 用法：
#   docker compose up -d        # 后台启动  →  http://localhost:8787
#   docker compose logs -f      # 看日志
#   docker compose down         # 停止（数据保留在 lda-data 卷）
#
# 配置可在同目录 .env 覆盖（复制 .env.example 为 .env 修改）。
services:
  lda:
    build:
      context: .
      dockerfile: Dockerfile
    image: lda-design:0.8.0
    container_name: lda-webui
    ports:
      - "${LDA_PORT:-8787}:8787"
    environment:
      LDA_WEBUI_PORT: "8787"
      DEPLOY_MODE: "selfhost"
      LDA_HOME: "/data"
    volumes:
      - lda-data:/data
    restart: unless-stopped
    healthcheck:
      # 容器探针：直接打 P2.1 新增的 /api/health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lda-data:
    driver: local
