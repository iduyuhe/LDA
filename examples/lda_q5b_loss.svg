<text x="34" y="502" font-family="Arial" font-size="9.5" fill="#475569">血案（口径）：D-120 列口径 (N−1)·per = 516.0 dB；平台邻耦合三角网格每模深度实测 = 2N−3 ⇒ 真账 1029.6 dB（低估 513.6 dB）</text>
<text x="34" y="518" font-family="Arial" font-size="9.5" fill="#475569">M5 收益兑现：矩形每模深度 = N ⇒ 1030 → 518 dB（省 511 dB），元件数不变（N(N−1)/2）</text>
<text x="34" y="534" font-family="Arial" font-size="9.5" fill="#475569">时间复用：通用（矩形调度）562 dB 优于三角静态、贵于矩形静态 43 dB（= N·延迟）⇒ 通用于省损不可兼得</text>
<text x="34" y="556" font-family="Arial" font-size="8.8" fill="#94a3b8">诚实边界：损耗为设计预算口径（非实测 PDK · 属 D5）；不含波导交叉损耗（三角网格 M2 实测 0 交叉；矩形交叉数属 P1-B）</text>
<text x="34" y="570" font-family="Arial" font-size="8.8" fill="#94a3b8">「每模深度」由构造实测（跑分解数门数）给出并附闭式核对；常数复用 D-120(2.4)/D-121(0.2,2.6)/D-122(矩形层)，不另建</text>
